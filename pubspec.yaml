name: foco
description: App de foco e bloqueio de apps com parceiro de confiança (Android e iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: Build e análise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Gerar android/ e ios/ e aplicar overlays
        run: |
          flutter create --org com.foco --project-name foco --platforms=android,ios .
          cp -R android_overlay/app/src/main/* android/app/src/main/
          cp -R ios_overlay/Runner/* ios/Runner/
          rm -f test/widget_test.dart
          flutter pub get 2>&1 | tee /tmp/pub.txt
      - name: Análise estática
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub 2>&1 | tee /tmp/analyze.txt; exit ${PIPESTATUS[0]}
      - name: Compilar APK (debug)
        id: build
        continue-on-error: true
        run: flutter build apk --debug 2>&1 | tee /tmp/build.txt; exit ${PIPESTATUS[0]}
      - name: Publicar logs na branch ci-logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp /tmp/pub.txt /tmp/analyze.txt /tmp/build.txt /tmp/logs/ 2>/dev/null || true
          echo "analyze=${{ steps.analyze.outcome }} build=${{ steps.build.outcome }} commit=${{ github.sha }}" > /tmp/logs/summary.txt
          cd /tmp/logs && git init -q -b ci-logs && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "logs ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
      - name: Publicar APK na Release "latest"
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk foco-debug.apk
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} 2>/dev/null || true
          gh release create latest foco-debug.apk -R ${{ github.repository }} \
            --title "Foco (debug)" --notes "APK de teste gerado automaticamente do commit ${{ github.sha }}." --prerelease
      - name: Falhar se algo deu errado
        if: steps.analyze.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

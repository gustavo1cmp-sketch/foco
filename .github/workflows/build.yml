name: Build e análise

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Gerar android/ e ios/ e aplicar overlays
        run: |
          flutter create --org com.foco --project-name foco --platforms=android,ios .
          cp -R android_overlay/app/src/main/* android/app/src/main/
          cp -R ios_overlay/Runner/* ios/Runner/
          flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Compilar APK (debug)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: foco-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
